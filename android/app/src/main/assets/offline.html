<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidak ada koneksi</title>
<style>
:root{--bg:#f5f5f5;--text:#1c1c1c;--muted:#737373;--primary:#171717;--on:#fff;--soft:#fffbeb;--warn:#d97706;--border:#e5e5e5}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--text:#f2f2f2;--muted:#a3a3a3;--primary:#f2f2f2;--on:#141414;--soft:rgba(245,158,11,.14);--warn:#fbbf24;--border:#2f2f2f}}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;text-align:center}
.icon{width:72px;height:72px;border-radius:22px;background:var(--soft);color:var(--warn);display:grid;place-items:center;margin:0 auto 20px}
h1{font-size:22px}
p{color:var(--muted);font-size:14px;line-height:1.5;margin:8px auto 0;max-width:300px}
button{margin-top:28px;height:54px;border-radius:16px;font-size:16px;font-weight:700;width:100%}
.main{border:0;background:var(--primary);color:var(--on)}
.alt{margin-top:10px;background:transparent;color:var(--muted);border:1px solid var(--border)}
</style>
</head>
<body>
<div class="icon"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2-1.5"/><path d="M2 8.82a15 15 0 0 1 4.18-2.65"/><path d="M22 8.82a15 15 0 0 0-11.29-3.76"/><path d="m2 2 20 20"/></svg></div>
<h1>Server tidak terjangkau</h1>
<p>Periksa sinyal atau Wi-Fi. Halaman yang sudah pernah dibuka tetap bisa dipakai saat offline, dan scan Anda tersimpan di HP.</p>
<button class="main" onclick="OptimaNative.reload()">Coba lagi</button>
<button class="alt" onclick="OptimaNative.changeServer()">Ganti alamat server</button>
</body>
</html>
