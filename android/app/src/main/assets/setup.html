<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Optima Gudang</title>
<style>
:root{--bg:#f5f5f5;--surface:#fff;--border:#e5e5e5;--text:#1c1c1c;--muted:#737373;--primary:#171717;--on:#fff;--brand:#ee4d2d;--bad:#e11d48}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--surface:#1c1c1c;--border:#2f2f2f;--text:#f2f2f2;--muted:#a3a3a3;--primary:#f2f2f2;--on:#141414;--bad:#fb7185}}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;padding:56px 20px 28px}
svg{width:56px;height:56px;color:var(--text)}
h1{font-size:26px;letter-spacing:-.02em;margin-top:22px}
p{color:var(--muted);font-size:14px;line-height:1.5;margin-top:6px}
label{display:block;font-size:13px;color:var(--muted);font-weight:600;margin:28px 2px 8px}
input{width:100%;height:54px;border-radius:14px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:16px;padding:0 16px;outline:none}
input:focus{border-color:var(--text)}
.chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:99px;padding:8px 14px;font-size:13px;font-weight:600}
.err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}
.grow{flex:1}
button.main{height:56px;width:100%;border:0;border-radius:16px;background:var(--primary);color:var(--on);font-size:16px;font-weight:700}
small{display:block;text-align:center;color:var(--muted);margin-top:14px;font-size:12px}
</style>
</head>
<body>
<svg viewBox="0 0 634 622"><path fill="currentColor" fill-rule="evenodd" d="M282.0 620.9C223.1 614.8 165.8 590.8 116.0 551.4C104.2 542.0 79.0 516.6 69.1 504.1C33.1 458.7 11.2 408.0 2.9 351.0C-10.2 260.9 22.9 164.7 90.5 96.5C178.6 7.6 309.4 -23.0 425.0 18.2C445.0 25.3 472.2 38.1 472.3 40.5C472.4 41.4 438.8 65.9 379.3 108.4L362.0 120.7L356.3 119.4C337.8 115.0 307.4 113.7 288.1 116.5C231.2 124.9 179.8 157.7 148.0 206.0C118.0 251.7 108.7 306.8 122.1 359.5C132.1 398.8 158.0 438.8 190.4 464.8C227.4 494.5 270.6 509.9 317.2 510.0C372.4 510.0 423.7 489.5 462.7 451.7C491.1 424.2 510.0 392.1 519.1 356.3C524.8 333.6 525.0 330.1 525.0 235.4L525.0 149.0L470.6 149.0L416.1 149.0L413.4 146.7L410.7 144.3L436.6 125.8C450.8 115.6 474.2 99.1 488.5 89.0C618.4 -2.5 613.7 0.7 619.0 0.2C624.7 -0.3 629.3 1.8 632.0 6.3C634.0 9.4 634.0 12.5 634.0 166.0C634.0 322.1 633.7 335.0 630.4 356.0C624.4 394.4 609.8 434.5 589.8 467.8C539.0 552.6 451.4 608.9 352.1 620.5C338.2 622.2 296.5 622.4 282.0 620.9Z"/></svg>
<h1>Optima Gudang</h1>
<p>Masukkan alamat Optima yang dipakai gudang Anda. Setelah ini Anda login memakai akun Optima biasa.</p>
<label for="server">Alamat server</label>
<input id="server" type="url" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="https://optisync.tech">
<div class="chips">
  <button class="chip" data-url="https://optisync.tech">optisync.tech (live)</button>
  <button class="chip" data-url="https://test.optisync.tech">test.optisync.tech</button>
</div>
<div class="err" id="err"></div>
<div class="grow"></div>
<button class="main" id="go">Hubungkan</button>
<small id="ver"></small>
<script>
var input = document.getElementById('server');
var info = {};
try { info = JSON.parse(OptimaNative.appInfo()); } catch (e) {}
input.value = info.server || info.defaultServer || 'https://optisync.tech';
document.getElementById('ver').textContent = 'Versi ' + (info.versionName || '-');
document.querySelectorAll('.chip').forEach(function (chip) {
  chip.addEventListener('click', function () { input.value = chip.dataset.url; });
});
document.getElementById('go').addEventListener('click', function () {
  var message = OptimaNative.saveServer(input.value);
  document.getElementById('err').textContent = message || '';
});
</script>
</body>
</html>
